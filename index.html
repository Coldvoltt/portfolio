    <!-- Applies the stored theme before first paint, so there is never a
         flash of the wrong one. Dark is the default: the system preference is
         deliberately not consulted. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("portfolio.theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "light" ? "#faf8f3" : "#0c0b0a");
          var c = document.querySelector('meta[name="color-scheme"]');
          if (c) c.setAttribute("content", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
